<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="glowCyan" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".8"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".2"/></linearGradient><linearGradient id="glowPurple" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#8b5cf6" stop-opacity=".8"/><stop offset="100%" stop-color="#ec4899" stop-opacity=".2"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".07"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><filter id="glowFilter" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="shadowFilter" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="4" flood-color="#000" flood-opacity=".6" stdDeviation="6"/></filter><style>@keyframes floatPulse{0%{transform:translateY(0) scale(1);opacity:.7}50%{transform:translateY(-10px) scale(1.05);opacity:.95}}@keyframes floatReverse{0%{transform:translateY(0) scale(1);opacity:.6}50%{transform:translateY(12px) scale(.95);opacity:.9}}@keyframes dashFlow{0%{stroke-dashoffset:40}}@keyframes pulseGlow{0%{opacity:.4;transform:scale(1)}50%{opacity:.8;transform:scale(1.15)}}.bg-card{animation:floatPulse 7s ease-in-out infinite}.bg-card-alt{animation:floatReverse 8s ease-in-out infinite}.flow-line{stroke-dasharray:8 6;animation:dashFlow 3s linear infinite}.pulse-node{animation:pulseGlow 4s ease-in-out infinite}.badge-text,.main-title,.sub-title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.main-title{font-weight:800;font-size:42px;fill:#fff}.sub-title{font-weight:500;font-size:19px;fill:#93c5fd}.badge-text{font-weight:600;font-size:13px;fill:#e2e8f0}</style></defs><rect width="1200" height="320" fill="url(#bgGradient)" rx="16"/><path stroke="#fff" stroke-opacity=".04" stroke-width="1" d="M 0,80 L 1200,80 M 0,160 L 1200,160 M 0,240 L 1200,240 M 300,0 L 300,320 M 600,0 L 600,320 M 900,0 L 900,320"/><g opacity=".6"><circle cx="150" cy="80" r="110" fill="url(#glowCyan)" class="pulse-node" filter="url(#glowFilter)"/><circle cx="1050" cy="240" r="130" fill="url(#glowPurple)" class="pulse-node" filter="url(#glowFilter)"/><path fill="none" stroke="#38bdf8" stroke-opacity=".3" stroke-width="2" d="M 120 220 Q 300 280 500 240 T 900 260" class="flow-line"/><path fill="none" stroke="#c084fc" stroke-opacity=".3" stroke-width="2" d="M 200 60 Q 450 20 700 80 T 1100 50" class="flow-line"/><g class="bg-card" transform="translate(80, 210)"><rect width="140" height="36" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity=".4" stroke-width="1.5" rx="18"/><circle cx="20" cy="18" r="6" fill="#38bdf8"/><text x="36" y="23" class="badge-text">JupyterLab</text></g><g class="bg-card-alt" transform="translate(960, 60)"><rect width="150" height="36" fill="url(#cardGrad)" stroke="#a855f7" stroke-opacity=".4" stroke-width="1.5" rx="18"/><circle cx="20" cy="18" r="6" fill="#a855f7"/><text x="36" y="23" class="badge-text">SageMaker AI</text></g><g class="bg-card" transform="translate(820, 215)"><rect width="130" height="36" fill="url(#cardGrad)" stroke="#ec4899" stroke-opacity=".4" stroke-width="1.5" rx="18"/><circle cx="20" cy="18" r="6" fill="#ec4899"/><text x="36" y="23" class="badge-text">Lightning AI</text></g><g class="bg-card-alt" transform="translate(240, 45)"><rect width="120" height="36" fill="url(#cardGrad)" stroke="#34d399" stroke-opacity=".4" stroke-width="1.5" rx="18"/><circle cx="20" cy="18" r="6" fill="#34d399"/><text x="36" y="23" class="badge-text">marimo</text></g></g><g filter="url(#shadowFilter)" text-anchor="middle" transform="translate(600, 150)"><g transform="translate(0, -75)"><rect width="280" height="32" x="-140" y="-16" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" rx="16"/><text x="0" y="5" fill="#818cf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">COMMUNITY CURATED REPOSITORY</text></g><text x="0" y="-15" class="main-title">Awesome ML IDE Ecosystem</text><text x="0" y="28" class="sub-title">Integrated Development Environments, Notebook Workspaces &amp; Self-Hosted ML Infrastructure</text><g><g transform="translate(0, 65) translate(-180, 0)"><rect width="120" height="26" x="-60" y="-12" fill="#0f172a" stroke="#38bdf8" stroke-opacity=".6" rx="6"/><text x="0" y="5" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">SaaS Platforms</text></g><g transform="translate(0, 65) translate(0, 0)"><rect width="130" height="26" x="-65" y="-12" fill="#0f172a" stroke="#c084fc" stroke-opacity=".6" rx="6"/><text x="0" y="5" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Open-Source IDEs</text></g><g transform="translate(0, 65) translate(180, 0)"><rect width="120" height="26" x="-60" y="-12" fill="#0f172a" stroke="#34d399" stroke-opacity=".6" rx="6"/><text x="0" y="5" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">CUDA Containers</text></g></g></g></svg>